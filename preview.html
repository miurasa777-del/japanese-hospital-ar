
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>病院で症状を伝えよう｜3D確認</title>

<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: "Noto Sans JP", sans-serif;
  background: #f9e1ea;
  color: #783e55;
}

header {
  background: #fff0f5;
  padding: 14px 92px 14px 16px;
  position: relative;
}

h1 {
  font-size: 19px;
  margin: 0 0 8px;
}

p {
  font-size: 13px;
  margin: 5px 0;
}

.hospital {
  position: absolute;
  right: 12px;
  top: 14px;
  font-size: 45px;
}

#stage {
  height: 450px;
  background: #fff2f6;
}

a-scene {
  width: 100%;
  height: 100%;
}

footer {
  background: #fff0f5;
  padding: 15px;
}

#sentence {
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 8px;
}

#question {
  font-size: 14px;
  margin-bottom: 15px;
}

.buttons {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

button {
  background: white;
  color: #783e55;
  border: 1px solid #e8b7c9;
  border-radius: 12px;
  padding: 12px 5px;
  font-size: 13px;
  font-weight: bold;
  cursor: pointer;
}

button.selected {
  background: #ffe17b;
  border-color: #e4bd50;
}

#status {
  color: #a9506e;
  font-size: 13px;
  font-weight: bold;
}
</style>
</head>

<body>

<header>
  <div class="hospital">🏥</div>
  <h1>人体模型（じんたいもけい）｜3D確認ページ</h1>
  <p>病気の場所をボタンで選んでください。</p>
  <p id="status">3Dを読み込んでいます…</p>
</header>

<div id="stage">

<a-scene
  embedded
  vr-mode-ui="enabled: false"
  background="color: #fff2f6"
  renderer="antialias: true">

  <a-entity
    id="person"
    position="0 0 0"
    scale="1 1 1">

    <!-- 頭 -->
    <a-sphere
      id="head"
      position="0 1.35 0"
      radius="0.24"
      color="#f4bfa6">
    </a-sphere>

    <!-- 髪 -->
    <a-sphere
      position="0 1.52 -0.04"
      radius="0.24"
      scale="1 0.45 1"
      color="#604753">
    </a-sphere>

    <!-- 目 -->
    <a-sphere position="-0.09 1.38 0.21"
      radius="0.018" color="#463740"></a-sphere>

    <a-sphere position="0.09 1.38 0.21"
      radius="0.018" color="#463740"></a-sphere>

    <!-- 口 -->
    <a-box position="0 1.28 0.226"
      width="0.09" height="0.012"
      depth="0.012" color="#b96f78"></a-box>

    <!-- 首 -->
    <a-cylinder position="0 1.08 0"
      radius="0.075" height="0.15"
      color="#f4bfa6"></a-cylinder>

    <!-- 胸・服 -->
    <a-box id="chest"
      position="0 0.80 0"
      width="0.57" height="0.42"
      depth="0.25"
      color="#83c6c9">
    </a-box>

    <!-- お腹 -->
    <a-box id="abdomen"
      position="0 0.49 0"
      width="0.50" height="0.22"
      depth="0.24"
      color="#83c6c9">
    </a-box>

    <!-- 左腕 -->
    <a-cylinder id="leftarm"
      position="-0.37 0.73 0"
      radius="0.085" height="0.48"
      rotation="0 0 -12"
      color="#f4bfa6">
    </a-cylinder>

    <!-- 右腕 -->
    <a-cylinder id="rightarm"
      position="0.37 0.73 0"
      radius="0.085" height="0.48"
      rotation="0 0 12"
      color="#f4bfa6">
    </a-cylinder>

    <!-- 左足 -->
    <a-cylinder id="leftleg"
      position="-0.14 0.18 0"
      radius="0.11" height="0.39"
      color="#7798ce">
    </a-cylinder>

    <!-- 右足 -->
    <a-cylinder id="rightleg"
      position="0.14 0.18 0"
      radius="0.11" height="0.39"
      color="#7798ce">
    </a-cylinder>

  </a-entity>

  <a-entity light="type: ambient; intensity: 1.2"></a-entity>

  <a-entity
    light="type: directional; intensity: 0.9"
    position="-1 3 3">
  </a-entity>

  <a-entity
    camera
    position="0 0.9 3.5"
    look-controls="enabled: false">
  </a-entity>

</a-scene>
</div>

<footer>

<div id="sentence"></div>
<div id="question"></div>

<div class="buttons">
  <button data-part="head">頭（あたま）</button>
  <button data-part="chest">胸（むね）</button>
  <button data-part="abdomen">お腹（おなか）</button>
  <button data-part="arm">腕（うで）</button>
  <button data-part="leg">足（あし）</button>
</div>

</footer>

<script>
const examples = {
  head: [
    "昨日から頭が痛いです。",
    "医師：いつから痛いですか？"
  ],
  chest: [
    "息をすると胸が痛いです。",
    "医師：どんなときに痛いですか？"
  ],
  abdomen: [
    "昨日の夜からお腹が痛いです。",
    "医師：いつから痛いですか？"
  ],
  arm: [
    "右の腕が痛いです。",
    "医師：どこが痛いですか？"
  ],
  leg: [
    "歩くと足が痛いです。",
    "医師：歩くとどうなりますか？"
  ]
};

const originalColors = {
  head: "#f4bfa6",
  chest: "#83c6c9",
  abdomen: "#83c6c9",
  leftarm: "#f4bfa6",
  rightarm: "#f4bfa6",
  leftleg: "#7798ce",
  rightleg: "#7798ce"
};

function choosePart(part) {
  document.getElementById("sentence").textContent =
    "「" + examples[part][0] + "」";

  document.getElementById("question").textContent =
    examples[part][1];

  Object.entries(originalColors).forEach(([id, color]) => {
    document.getElementById(id).setAttribute("color", color);
  });

  const targets = {
    head: ["head"],
    chest: ["chest"],
    abdomen: ["abdomen"],
    arm: ["leftarm", "rightarm"],
    leg: ["leftleg", "rightleg"]
  };

  targets[part].forEach(id => {
    document.getElementById(id).setAttribute("color", "#ffe05e");
  });

  document.querySelectorAll("button[data-part]").forEach(button => {
    button.classList.toggle(
      "selected",
      button.dataset.part === part
    );
  });
}

document.querySelectorAll("button[data-part]").forEach(button => {
  button.addEventListener("click", () => {
    choosePart(button.dataset.part);
  });
});

choosePart("abdomen");

if (window.AFRAME) {
  document.getElementById("status").textContent =
    "3Dライブラリを読み込みました。";
} else {
  document.getElementById("status").textContent =
    "3Dライブラリを読み込めませんでした。";
}
</script>

</body>
</html>
