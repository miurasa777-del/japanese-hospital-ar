
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>病院で症状を伝えよう｜AR</title>

<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/3.4.8/aframe/build/aframe-ar.js"></script>

<style>
* {
  box-sizing: border-box;
}

html, body {
  height: 100%;
  margin: 0;
}

body {
  font-family: system-ui, "Noto Sans JP", sans-serif;
  background: #f9e1ea;
  color: #743c55;
}

a-scene {
  display: block !important;
  height: 100vh !important;
  width: 100% !important;
}

#top, #bottom {
  position: fixed;
  left: 0;
  right: 0;
  z-index: 20;
}

#top {
  top: 0;
  background: rgba(255,242,246,.94);
  border-bottom: 1px solid #e6bccb;
  padding: 12px 88px 12px 14px;
}

h1 {
  font-size: 17px;
  margin: 0 0 6px;
}

#subtitle, #status {
  font-size: 12px;
  margin: 5px 0;
}

#status {
  color: #94566e;
  font-weight: bold;
}

#bottom {
  bottom: 0;
  background: rgba(255,245,249,.97);
  padding: 12px;
  border-top: 1px solid #e6bccb;
}

#phrase {
  font-size: 17px;
  font-weight: bold;
  margin-bottom: 6px;
}

#doctor {
  font-size: 13px;
  margin-bottom: 12px;
}

.buttons {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 5px;
}

button {
  border: 1px solid #dca6bb;
  background: #fff7fa;
  color: #813b59;
  border-radius: 10px;
  padding: 12px 2px;
  font-size: 12px;
  font-weight: bold;
}

button.selected {
  background: #ffe17b;
}

#links {
  display: flex;
  gap: 14px;
  margin-top: 12px;
  font-size: 12px;
}

a {
  color: #9b4764;
}

#hospital {
  position: absolute;
  right: 12px;
  top: 12px;
  font-size: 43px;
}
</style>
</head>

<body>

<div id="top">
  <div id="hospital">🏥</div>
  <h1>病院で症状を伝えよう｜AR</h1>
  <div id="subtitle">
    痛い場所を選んで、症状を伝えましょう。
  </div>
  <div id="status">
    Hiroマーカーを映してください。
  </div>
</div>

<a-scene
  embedded
  vr-mode-ui="enabled: false"
  renderer="alpha: true; antialias: true"
  arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono">

  <a-marker
    id="marker"
    preset="hiro"
    emitevents="true"
    smooth="true"
    smoothCount="5">

    <a-entity
      id="person"
      position="0 90 0"
      scale="0.45 0.45 0.45">

      <!-- 台座 -->
      <a-cylinder
        position="0 0.012 0"
        radius="0.42"
        height="0.025"
        color="#efb6c9">
      </a-cylinder>

      <!-- 頭 -->
      <a-sphere
        id="piece-head"
        position="0 1.35 0"
        radius="0.24"
        color="#f4bfa6">
      </a-sphere>

      <!-- 髪 -->
      <a-sphere
        position="0 1.52 -0.04"
        radius="0.24"
        scale="1 0.45 1"
        color="#604753">
      </a-sphere>

      <!-- 目 -->
      <a-sphere
        position="-0.09 1.38 0.21"
        radius="0.018"
        color="#463740">
      </a-sphere>

      <a-sphere
        position="0.09 1.38 0.21"
        radius="0.018"
        color="#463740">
      </a-sphere>

      <!-- 口 -->
      <a-box
        position="0 1.28 0.226"
        width="0.09"
        height="0.012"
        depth="0.012"
        color="#b96f78">
      </a-box>

      <!-- 首 -->
      <a-cylinder
        position="0 1.08 0"
        radius="0.075"
        height="0.15"
        color="#f4bfa6">
      </a-cylinder>

      <!-- 胸・服 -->
      <a-box
        id="piece-chest"
        position="0 0.80 0"
        width="0.57"
        height="0.42"
        depth="0.25"
        color="#83c6c9">
      </a-box>

      <!-- お腹 -->
      <a-box
        id="piece-abdomen"
        position="0 0.49 0"
        width="0.50"
        height="0.22"
        depth="0.24"
        color="#83c6c9">
      </a-box>

      <!-- 左腕 -->
      <a-cylinder
        id="piece-leftarm"
        position="-0.37 0.73 0"
        radius="0.085"
        height="0.48"
        rotation="0 0 -12"
        color="#f4bfa6">
      </a-cylinder>

      <!-- 右腕 -->
      <a-cylinder
        id="piece-rightarm"
        position="0.37 0.73 0"
        radius="0.085"
        height="0.48"
        rotation="0 0 12"
        color="#f4bfa6">
      </a-cylinder>

      <!-- 左足 -->
      <a-cylinder
        id="piece-leftleg"
        position="-0.14 0.18 0"
        radius="0.11"
        height="0.39"
        color="#7798ce">
      </a-cylinder>

      <!-- 右足 -->
      <a-cylinder
        id="piece-rightleg"
        position="0.14 0.18 0"
        radius="0.11"
        height="0.39"
        color="#7798ce">
      </a-cylinder>

    </a-entity>

  </a-marker>

  <a-entity camera></a-entity>

</a-scene>

<div id="bottom">

  <div id="phrase"></div>
  <div id="doctor"></div>

  <div class="buttons">
    <button data-part="head">頭（あたま）</button>
    <button data-part="chest">胸（むね）</button>
    <button data-part="abdomen">お腹（おなか）</button>
    <button data-part="arm">腕（うで）</button>
    <button data-part="leg">足（あし）</button>
  </div>

  <div id="links">
    <a href="preview.html">カメラなしで3D確認</a>
    <a href="https://raw.githubusercontent.com/AR-js-org/AR.js/master/data/images/hiro.png"
       target="_blank">Hiroマーカー</a>
  </div>

</div>

<script>
const examples = {
  head: [
    "昨日から頭が痛いです。",
    "医師：いつから痛いですか？"
  ],
  chest: [
    "息をすると胸が痛いです。",
    "医師：どんなときに痛いですか？"
  ],
  abdomen: [
    "昨日の夜からお腹が痛いです。",
    "医師：いつから痛いですか？"
  ],
  arm: [
    "右の腕が痛いです。",
    "医師：どこが痛いですか？"
  ],
  leg: [
    "歩くと足が痛いです。",
    "医師：歩くとどうなりますか？"
  ]
};

const colors = {
  head: "#f4bfa6",
  chest: "#83c6c9",
  abdomen: "#83c6c9",
  leftarm: "#f4bfa6",
  rightarm: "#f4bfa6",
  leftleg: "#7798ce",
  rightleg: "#7798ce"
};

const targets = {
  head: ["head"],
  chest: ["chest"],
  abdomen: ["abdomen"],
  arm: ["leftarm", "rightarm"],
  leg: ["leftleg", "rightleg"]
};

function selectPart(part) {

  document.getElementById("phrase").textContent =
    "「" + examples[part][0] + "」";

  document.getElementById("doctor").textContent =
    examples[part][1];

  Object.entries(colors).forEach(([id, color]) => {
    document.getElementById("piece-" + id)
      .setAttribute("color", color);
  });

  targets[part].forEach(id => {
    document.getElementById("piece-" + id)
      .setAttribute("color", "#ffe05e");
  });

  document.querySelectorAll("button[data-part]").forEach(button => {
    button.classList.toggle(
      "selected",
      button.dataset.part === part
    );
  });
}

document.querySelectorAll("button[data-part]").forEach(button => {
  button.addEventListener("click", () => {
    selectPart(button.dataset.part);
  });
});

selectPart("abdomen");

const marker = document.getElementById("marker");

marker.addEventListener("markerFound", () => {
  document.getElementById("status").textContent =
    "✓ Hiroマーカーを認識しています。";
});

marker.addEventListener("markerLost", () => {
  document.getElementById("status").textContent =
    "Hiroマーカーを映してください。";
});

if (!window.AFRAME || !AFRAME.components.arjs) {
  document.getElementById("status").textContent =
    "ARライブラリの読み込みを確認してください。";
}
</script>

</body>
</html>
